# Profiles (combine freely):  docker compose -f docker/docker-compose.yml --profile kafka --profile postgres --profile redis --profile monitoring up --build
#   kafka      Apache Kafka (KRaft)          -> set KAFKA_BOOTSTRAP=kafka:9092
#   postgres   PostgreSQL 16                 -> set DATABASE_URL=postgresql://aegis:aegis@postgres:5432/aegis
#   redis      Redis 7 (shared state)        -> set REDIS_URL=redis://redis:6379/0
#   neo4j      Neo4j 5 (graph mirror)        -> set NEO4J_URI=bolt://neo4j:7687 NEO4J_PASSWORD=aegis-neo4j
#   monitoring Prometheus + Grafana          -> Grafana http://localhost:3000 (admin/admin), dashboard "AegisClick"
# The profile services only start when selected; the app falls back gracefully if a selected backend is unreachable.
services:
  app:
    build: {context: .., dockerfile: docker/Dockerfile}
    ports: ["8000:8000"]
    env_file: [{path: ../.env, required: false}]
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      MASTER_KEY: ${MASTER_KEY:-change-me-too}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    volumes: ["aegis-data:/app/data", "aegis-models:/app/models", "aegis-reports:/app/reports"]
    restart: unless-stopped
  kafka:
    profiles: ["kafka"]
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment: {POSTGRES_USER: aegis, POSTGRES_PASSWORD: aegis, POSTGRES_DB: aegis}
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
  redis:
    profiles: ["redis"]
    image: redis:7
    ports: ["6379:6379"]
  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5
    environment: {NEO4J_AUTH: "neo4j/aegis-neo4j"}
    ports: ["7474:7474", "7687:7687"]
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    environment: {GF_SECURITY_ADMIN_PASSWORD: admin, GF_AUTH_ANONYMOUS_ENABLED: "true"}
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro", "./grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["3000:3000"]
volumes: {aegis-data: {}, aegis-models: {}, aegis-reports: {}, pg-data: {}}
